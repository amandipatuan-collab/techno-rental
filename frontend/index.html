<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rentwise · Rental Management System</title>
  <meta name="description" content="Rental Management System: properties, tenants, contracts, billing, payments, concerns and announcements.">
  <meta name="theme-color" content="#1B4D7E">
  <!-- Apply the saved theme before first paint (no flash) -->
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("rms-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The whole UI is rendered by app.js (hash routing: #/login, #/admin/..., #/tenant/...) -->
  <div id="app" aria-live="off">
    <noscript>
      <p class="noscript">Rentwise needs JavaScript enabled to run.</p>
    </noscript>
  </div>

  <!-- Modal dialogs are mounted here -->
  <div id="dialog-root"></div>

  <!-- Toast messages (announced to screen readers) -->
  <div id="toast" class="toast is-hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
